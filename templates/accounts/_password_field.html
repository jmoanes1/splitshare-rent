{% load sharesplit_tags %}
<div class="form-group">
  <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="req">*</span>{% endif %}</label>
  <div class="password-wrap">
    {{ field }}
    <button type="button" class="password-toggle" data-password-toggle="{{ field.id_for_label }}"
            data-icon-on='{% icon "eye" %}' data-icon-off='{% icon "eye-off" %}'
            aria-label="Show password">{% icon 'eye' %}</button>
  </div>
  {% if field.help_text %}<span class="helptext" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</span>{% endif %}
  {{ field.errors }}
</div>
